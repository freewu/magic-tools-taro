// Android（React Native）宿主工程根配置
// 说明：本工程的职责只是「原生壳 + 打包」；JS 由 taro build --type rn 产出
// （dist/rn/index.android.bundle），再由 scripts/android.mjs 同步进 app/src/main。
buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34
        // NDK 版本：默认对齐 RN 0.73 官方版本，可用 -PndkVersion=xxx 或 RN_NDK_VERSION 覆盖
        // （本机 SDK 已装别的版本时就别让它再下一次几百 MB）
        ndkVersion = project.findProperty("ndkVersion") ?: (System.getenv("RN_NDK_VERSION") ?: "25.1.8937393")
        kotlinVersion = "1.8.0"
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        maven {
            // expo-camera bundles a custom com.google.android:cameraview
            url "$rootDir/../node_modules/expo-camera/android/maven"
        }
    }
}
apply plugin: "com.facebook.react.rootproject"
